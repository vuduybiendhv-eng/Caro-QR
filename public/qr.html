
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Caro Live</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    .qr-page {
      width: 100%;
      max-width: 520px;
      margin: 25px auto;
      padding: 24px;
      text-align: center;
      border: 3px solid #f4c85c;
      border-radius: 26px;
      background: linear-gradient(145deg, #fff2d8, #e9bd78);
      color: #633817;
      box-shadow: 0 8px 22px rgba(35,15,5,.3);
    }

    .qr-page h1 {
      margin: 10px 0;
      color: #75421b;
      font-size: 36px;
    }

    .qr-page p {
      line-height: 1.5;
    }

    .qr-image-frame {
      display: inline-block;
      margin: 15px auto;
      padding: 12px;
      border: 4px solid #d69a39;
      border-radius: 20px;
      background: white;
    }

    .qr-image-frame img {
      display: block;
      width: 250px;
      height: 250px;
      max-width: 65vw;
      max-height: 65vw;
      object-fit: contain;
    }

    .qr-link {
      display: block;
      margin: 12px 0;
      padding: 12px;
      border-radius: 12px;
      background: #fff9ed;
      color: #633817;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .qr-button {
      display: inline-block;
      margin-top: 10px;
      padding: 13px 22px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffe39a, #eca638);
      color: #5b3217;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .qr-note {
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="qr-page">
    <div class="eyebrow">SCAN TO PLAY</div>

    <h1>CARO LIVE</h1>

    <p>
      Quét mã QR để vào phòng chơi Caro.
      Tặng quà trên TikTok LIVE để đăng ký đấu.
    </p>

    <div class="qr-image-frame">
      <img
        id="qr"
        alt="Mã QR vào phòng Caro Live"
      >
    </div>

    <p><strong>LINK VÀO CHƠI:</strong></p>

    <div class="qr-link" id="url">
      https://caro-qr-production-fe079703.up.railway.app/play
    </div>

    <button class="qr-button" id="copyLink">
      📋 Sao chép link chơi
    </button>

    <p class="qr-note">
      Chỉ quét mã từ phòng LIVE chính thức.
    </p>
  </main>

  <script>
    const playUrl =
      "https://caro-qr-production-fe079703.up.railway.app/play";

    const qrImage = document.getElementById("qr");

    qrImage.src =
      "https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=15&data="
      + encodeURIComponent(playUrl);

    document.getElementById("copyLink").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(playUrl);
        document.getElementById("copyLink").textContent = "✓ Đã sao chép link";
      } catch (error) {
        document.getElementById("url").textContent = playUrl;
      }
    });
  </script>
</body>
</html>
